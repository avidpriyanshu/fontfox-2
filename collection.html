<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FontFox Collection</title>
    <link rel="stylesheet" href="collection.css">
  </head>
  <body>
    <main class="page">
      <aside class="sidebar">
        <div class="sidebarTop">
          <button id="resetPreview" class="resetButton" type="button">Reset all</button>
          <button id="clearPreview" class="closeButton" type="button" aria-label="Clear preview">x</button>
        </div>
        <div class="previewControl">
          <label for="previewText">Preview text</label>
          <textarea id="previewText">Whereas recognition of the inherent dignity</textarea>
          <div class="sizeControl">
            <select id="previewSize" aria-label="Preview size">
              <option value="32">32px</option>
              <option value="40" selected>40px</option>
              <option value="48">48px</option>
              <option value="64">64px</option>
            </select>
            <input id="previewSizeRange" type="range" min="24" max="72" value="40" aria-label="Preview size slider">
          </div>
        </div>
        <section class="otherCollections" aria-label="Other collections">
          <h2 class="sectionTitle">Other collections</h2>
          <div id="otherCollections" class="collectionList"></div>
        </section>
      </aside>

      <section class="content">
        <nav class="topbar">
          <div class="brand">
            <span class="mark">Ff</span>
            <span>FontFox</span>
          </div>
          <div id="topActions" class="topActions"></div>
        </nav>

        <section class="hero">
          <h1 id="collectionTitle" class="collectionTitle"></h1>
          <p id="collectionMeta" class="eyebrow"></p>
          <span class="about">About these results</span>
        </section>

        <section id="fontGrid" class="grid" aria-label="Font families"></section>
        <p id="message" class="message" role="status"></p>
      </section>
    </main>

    <script src="src/browser-api.js"></script>
    <script src="src/font-sources.js"></script>
    <script src="src/bookmark-store.js"></script>
    <script src="src/collection.js"></script>
  </body>
</html>
